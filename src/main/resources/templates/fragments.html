<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">	
	<body>
<!-- fragments :: head -->		
		<head th:fragment= "head">
		<!-- BOOTSTRAP CSS -->
		<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" >
		<title>[[${title}]]</title>		
		</head>
<!-- fragments :: header -->		
		<header th:fragment="header">
			<nav class="navbar navbar-expand-lg bg-body-tertiary">
			  <div class="container-fluid">
			    <a class="navbar-brand" href="/">Best of</a>
			    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
			      <span class="navbar-toggler-icon"></span>
			    </button>
			    <div class="collapse navbar-collapse" id="navbarNav">
			      <ul class="navbar-nav">
			        <li class="nav-item">
			          <a class="nav-link active" th:href="@{/movies}">Movies</a>
			        </li>
			        <li class="nav-item">
			          <a class="nav-link" th:href="@{/songs}">Songs</a>
			        </li>
			      </ul>
			    </div>
			  </div>
			</nav>
		</header>
		
<!-- fragments :: main-standard -->		
		<div th:fragment="main-standard"
			 class="container-sm text-center px-3">
			<h1>[[${h1}]]</h1>
			<ul th:replace="~{fragments :: ${type}}"></ul>
		</div>	
		
<!-- fragments :: generate-list -->		
		<ul th:fragment="generate-list" class="list-group">
			<li th:each="element : ${list}" 
			    th:text="|${title} ${element.id+1}|" 
			    th:href="|/${title.toLowerCase()}/${element.id}|" 
			    class="list-group-item list-group-item-action text-black" 
				>
		</ul>
		
<!-- fragments :: show-details -->			
		<div th:fragment="show-details" class="row justify-content-center">
			<div class="card col-2" style="width: 18rem;">
				<img th:src="|${image}|" class="card-img-top" alt="Movie image">
				<div class="card-body">
					<p th:text="${name}"></p>
				</div>
			</div>
		</div>
				
<!-- fragments :: scripts -->		
		<th:block th:fragment="scripts">
			<!-- BOOTSTRAP SCRIPT -->
			<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}" defer></script>
		</th:block>

	</body>

</html>
